
<!-- Dashboard component -->
<section class="dashboard-container" aria-labelledby="dashboard-title">
	<h2 id="dashboard-title">Welcome to the PrimeStacks Dashboard</h2>
	
	<div class="dashboard-content">
		<p>You are now logged in to your PrimeStacks account.</p>
		
		<div class="dashboard-stats">
			<div class="stat-card">
				<h3>Statistics</h3>
				<p>Your account information and statistics will appear here.</p>
			</div>
		</div>

		<div class="dashboard-actions">
			<button class="btn-logout" (click)="onLogout($event)">Logout</button>
		</div>
	</div>
</section>
