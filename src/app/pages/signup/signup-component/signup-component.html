<div class="signup-page">
  <div class="signup-card">
    <h1>Create an Account</h1>
    <p>Join us and start your journey with Primestacks.</p>
    <form class="signup-form">
      <label>
        <span>Full Name</span>
        <input type="text" name="fullName" placeholder="Enter your full name" required />
      </label>
      <label>
        <span>Email Address</span>
        <input type="email" name="email" placeholder="you@example.com" required />
      </label>
      <label>
        <span>Password</span>
        <input type="password" name="password" placeholder="Create a password" required />
      </label>
      <label>
        <span>Confirm Password</span>
        <input type="password" name="confirmPassword" placeholder="Repeat your password" required />
      </label>
      <button type="submit">Sign Up</button>
    </form>
    <p class="login-link">Already have an account? <a href="#" (click)="onLoginClick($event)">Log in</a></p>
  </div>
</div>
